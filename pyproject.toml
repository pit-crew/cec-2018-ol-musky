[project]
name = "ol-musky"
version = "0.1.0"
description = "Ol' Musky asteroid mining game server (CEC 2018 MCP)"
readme = "README.md"
authors = [
    { name = "pit-crew", email = "somebit@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["admin"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
